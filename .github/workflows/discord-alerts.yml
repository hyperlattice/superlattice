name: Discord alerts

on:
  issues:
    types: [opened, edited, reopened, closed, assigned, unassigned]
  pull_request_target:
    types: [opened, edited, reopened, closed, assigned, unassigned, review_requested, review_request_removed, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This job has a secret. Only check out trusted default-branch code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Send notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/notify.mjs
