name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm test
      - name: Build and smoke-test Docker service
        run: |
          docker build -t discordbot-test .
          docker run -d --name discordbot-test -p 127.0.0.1:3000:3000 \
            -e GITHUB_WEBHOOK_SECRET=ci-only-test-secret-with-at-least-32-characters \
            -e DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/123/ci-test \
            discordbot-test
          trap 'docker logs discordbot-test; docker rm -f discordbot-test' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:3000/healthz; then
              exit 0
            fi
            sleep 1
          done
          exit 1
